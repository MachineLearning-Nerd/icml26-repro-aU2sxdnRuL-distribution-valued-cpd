<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Claim 2 ARL bound audit</title><desc id="desc">Observed calibrated global ARL proxy 241.4 lies below literal bound 251 and above corrected finite-sample bound 234.39.</desc>
  <rect width="900" height="360" fill="#0b1020"/>
  <text x="50" y="55" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="700">Claim 2: observed ARL falls between corrected and literal bounds</text>
  <line x1="90" y1="230" x2="835" y2="230" stroke="#64748b" stroke-width="3"/>
  <line x1="340" y1="130" x2="340" y2="260" stroke="#22c55e" stroke-width="5"/><text x="340" y="112" fill="#86efac" font-family="sans-serif" font-size="17" text-anchor="middle">234.39 corrected</text>
  <line x1="515" y1="145" x2="515" y2="260" stroke="#22d3ee" stroke-width="7"/><text x="515" y="128" fill="#67e8f9" font-family="sans-serif" font-size="18" text-anchor="middle">241.4 observed</text>
  <line x1="755" y1="130" x2="755" y2="260" stroke="#fb7185" stroke-width="5"/><text x="755" y="112" fill="#fda4af" font-family="sans-serif" font-size="17" text-anchor="middle">251 literal claim</text>
  <text x="50" y="315" fill="#cbd5e1" font-family="sans-serif" font-size="16">4,000 seeded null streams, n₀=200; half-threshold control = 207.56. Verdict: FALSIFIED.</text>
