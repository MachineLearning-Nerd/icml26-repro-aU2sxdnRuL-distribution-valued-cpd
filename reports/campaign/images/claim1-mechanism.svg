<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Claim 1 full multivariate mechanism audit</title><desc id="desc">Exact optimal transport assignments match tangent norms to machine precision, and negative controls are rejected.</desc>
  <rect width="900" height="390" fill="#0b1020"/>
  <text x="50" y="54" fill="#f8fafc" font-family="sans-serif" font-size="26" font-weight="700">Claim 1: paper-scale multivariate mechanism verified</text>
  <g font-family="sans-serif">
    <text x="50" y="108" fill="#cbd5e1" font-size="17">d=5 · 300 Phase-I + 300 Phase-II distributions · 300 points each</text>
    <rect x="50" y="145" width="800" height="56" rx="10" fill="#123047"/><text x="74" y="180" fill="#67e8f9" font-size="18">max OT identity error</text><text x="815" y="180" fill="#f8fafc" font-size="20" text-anchor="end">6.94×10⁻¹⁸</text>
    <rect x="50" y="216" width="800" height="56" rx="10" fill="#17352b"/><text x="74" y="251" fill="#86efac" font-size="18">independent T² checker error</text><text x="815" y="251" fill="#f8fafc" font-size="20" text-anchor="end">1.35×10⁻¹³</text>
    <text x="50" y="323" fill="#cbd5e1" font-size="16">Rejected controls: identity map, wrong-reference indexed plan, and unscaled Hotelling statistic.</text>
    <text x="50" y="354" fill="#94a3b8" font-size="15">Scope: full mechanism/equations on controlled affine Gaussian pushforwards, not a performance-table rerun.</text>
  </g>
</svg>
